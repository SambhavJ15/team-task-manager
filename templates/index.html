{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-grid">
        <div class="auth-hero">
            <div class="hero-icon">
                <i class="fas fa-cloud-moon"></i>
            </div>
            <h1>TaskFlow</h1>
            <p>Where teams turn ideas into action</p>
            <div class="hero-features">
                <span><i class="fas fa-check-circle"></i> Real-time sync</span>
                <span><i class="fas fa-chart-line"></i> Analytics</span>
                <span><i class="fas fa-users"></i> Team collab</span>
            </div>
        </div>
        <div class="auth-card">
            <div class="auth-card-inner">
                <div class="auth-tabs">
                    <button class="tab active" onclick="switchTab('login')">Sign in</button>
                    <button class="tab" onclick="switchTab('register')">Get started</button>
                </div>
                
                <div id="login-panel" class="auth-panel active">
                    <form id="loginForm">
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" id="login-username" placeholder="Username" required>
                        </div>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="auth-btn">Launch Dashboard <i class="fas fa-arrow-right"></i></button>
                    </form>
                    <div class="demo-note">
                        <i class="fas fa-flask"></i> Demo: admin / admin123
                    </div>
                </div>
                
                <div id="register-panel" class="auth-panel">
                    <form id="registerForm">
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" id="reg-username" placeholder="Username" required>
                        </div>
                        <div class="input-field">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="reg-email" placeholder="Email" required>
                        </div>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="reg-password" placeholder="Password" required>
                        </div>
                        <button type="submit" class="auth-btn">Create account <i class="fas fa-user-plus"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function switchTab(tab) {
    const loginPanel = document.getElementById('login-panel');
    const registerPanel = document.getElementById('register-panel');
    const tabs = document.querySelectorAll('.tab');
    
    if (tab === 'login') {
        loginPanel.classList.add('active');
        registerPanel.classList.remove('active');
        tabs[0].classList.add('active');
        tabs[1].classList.remove('active');
    } else {
        loginPanel.classList.remove('active');
        registerPanel.classList.add('active');
        tabs[0].classList.remove('active');
        tabs[1].classList.add('active');
    }
}

// Login handler
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('login-username').value;
    const password = document.getElementById('login-password').value;
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showNotification('Welcome back!', 'success');
            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 500);
        } else {
            showNotification(data.error || 'Login failed! Check credentials', 'error');
        }
    } catch (error) {
        console.error('Login error:', error);
        showNotification('Network error. Please try again.', 'error');
    }
});

// Register handler
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('reg-username').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    
    if (username.length < 3) {
        showNotification('Username must be at least 3 characters', 'error');
        return;
    }
    
    if (password.length < 4) {
        showNotification('Password must be at least 4 characters', 'error');
        return;
    }
    
    try {
        const response = await fetch('/api/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, email, password})
        });
        
        const data = await response.json();
        
        if (response.ok) {
            showNotification('Account created! Please login.', 'success');
            switchTab('login');
            document.getElementById('reg-username').value = '';
            document.getElementById('reg-email').value = '';
            document.getElementById('reg-password').value = '';
        } else {
            showNotification(data.error || 'Registration failed', 'error');
        }
    } catch (error) {
        console.error('Register error:', error);
        showNotification('Network error. Please try again.', 'error');
    }
});
</script>
{% endblock %}
